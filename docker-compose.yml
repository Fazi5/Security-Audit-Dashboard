version: '3.8'

services:
  security-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: security-audit-dashboard
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/SecurityAuditDashboard.db
    volumes:
      - security-data:/app/data
      - security-logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  security-data:
    driver: local
  security-logs:
    driver: local
